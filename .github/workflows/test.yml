name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
        working-directory: server
      - run: npx tsc --noEmit
        working-directory: server
      - run: npm test -w server
      - run: npx -w client vite build
